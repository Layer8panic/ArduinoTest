<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Officina Magica di Sparky · Prova pratica Arduino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --night1:#0B1033; --night2:#1B1F5E; --night3:#3A2C7A;
  --cream:#FFF8EC; --ink:#22264A; --ink2:#5A5F86;
  --gold:#FFC93C; --gold2:#FF9F1C; --teal:#2ED3C3; --teal2:#138C9C;
  --pink:#FF6FA8; --red:#FF5A5F; --green:#33D17A; --blue:#4DA6FF;
  --r:22px;
  --title:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:#1B1F5E}
body{font-family:var(--body);color:var(--ink);background:radial-gradient(1200px 700px at 70% -10%,#5B3FA8 0%,transparent 60%),radial-gradient(900px 600px at 0% 110%,#13597A 0%,transparent 60%),linear-gradient(180deg,var(--night1),var(--night2) 55%,var(--night3));background-attachment:fixed;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
/* ---------- sky ---------- */
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
.firefly{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(#FFF6B0,#FFC93C 50%,transparent 70%);filter:blur(.5px);animation:fly 14s ease-in-out infinite}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(60px,-40px)}50%{transform:translate(-30px,-90px)}75%{transform:translate(-70px,-20px)}100%{transform:translate(0,0)}}
.hills{position:fixed;left:0;bottom:0;width:100%;height:22vh;pointer-events:none;z-index:0;opacity:.9}
/* ---------- HUD ---------- */
#hud{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(11,16,51,.72);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08);color:#fff}
#hud .logo{font-family:var(--title);font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px;white-space:nowrap}
#hud .logo b{background:linear-gradient(90deg,#FFE27A,#FF9F1C);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);padding:6px 12px;border-radius:999px;font-weight:800;font-size:14px;white-space:nowrap}
.chip.gold{background:linear-gradient(180deg,#FFE27A,#FFB01F);color:#5A3300;border-color:#FFD44F}
#hud .sp{flex:1}
.btn{border:0;border-radius:16px;padding:13px 22px;font-weight:900;font-size:16px;color:#fff;background:linear-gradient(180deg,#5FE3D3,#18A3B3);box-shadow:0 5px 0 #0E6F7E,0 10px 20px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s,filter .2s;letter-spacing:.2px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0E6F7E,0 4px 10px rgba(0,0,0,.2)}
.btn.gold{background:linear-gradient(180deg,#FFE27A,#FFA41B);color:#5A3300;box-shadow:0 5px 0 #C46F00,0 10px 20px rgba(0,0,0,.25)}
.btn.gold:active{box-shadow:0 1px 0 #C46F00}
.btn.pink{background:linear-gradient(180deg,#FF8FC0,#F0508F);box-shadow:0 5px 0 #A82A62,0 10px 20px rgba(0,0,0,.25)}
.btn.pink:active{box-shadow:0 1px 0 #A82A62}
.btn.ghost{background:rgba(255,255,255,.12);box-shadow:none;border:2px solid rgba(255,255,255,.25)}
.btn.light{background:#fff;color:var(--ink);box-shadow:0 4px 0 #D6D0C2}
.btn.small{padding:8px 14px;font-size:14px;border-radius:12px}
.btn:disabled{filter:grayscale(.8) brightness(.9);cursor:not-allowed}
#hud .btn{padding:9px 16px;font-size:14px}
/* ---------- layout ---------- */
#app{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:26px 20px 80px}
.screen{animation:pop .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.card{background:var(--cream);border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.35),inset 0 -6px 0 rgba(0,0,0,.05);padding:28px}
h1,h2,h3{font-family:var(--title);margin:0 0 10px}
.muted{color:var(--ink2)}
/* ---------- Sparky ---------- */
.sparky{width:100%;height:auto;overflow:visible}
.sparky .sp-all{animation:bob 3s ease-in-out infinite;transform-origin:100px 200px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.sparky .sp-shadow{animation:shad 3s ease-in-out infinite;transform-origin:100px 220px}
@keyframes shad{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.85)}}
.sparky .sp-eyes{animation:blink 4.5s infinite;transform-origin:100px 90px}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}
.sparky .sp-spark{animation:glow 1.6s ease-in-out infinite;transform-origin:108px 12px}
@keyframes glow{0%,100%{transform:scale(.85);opacity:.8}50%{transform:scale(1.25);opacity:1}}
.sparky .sp-star{animation:spin 6s linear infinite;transform-origin:108px 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.sparky .sp-armR{transform-origin:142px 150px;animation:wave 2.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.sparky.cheer .sp-armR,.sparky.cheer .sp-armL{animation:cheer .5s ease-in-out infinite alternate}
.sparky .sp-armL{transform-origin:58px 150px}
@keyframes cheer{from{transform:rotate(0)}to{transform:rotate(18deg)}}
.sparky.cheer .sp-all{animation:jump .6s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
.sparky.sad .sp-all{animation:none;transform:translateY(4px)}
.sparky .sp-led{animation:ledb 1s steps(2) infinite}
@keyframes ledb{50%{opacity:.25}}
/* bubble */
.bubble{position:relative;background:#fff;border-radius:22px;padding:16px 18px;font-weight:700;font-size:16.5px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.25);color:var(--ink)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-14px;margin-left:-14px;border:14px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.typing{animation:pop .3s}
/* ---------- splash ---------- */
.splash{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;min-height:72vh;color:#fff}
.splash h1{font-size:clamp(40px,6vw,76px);line-height:.98;letter-spacing:-1px;text-shadow:0 6px 0 rgba(0,0,0,.25)}
.splash h1 .l1{display:block;font-size:.45em;color:#B9C3FF;letter-spacing:1px}
.splash h1 .l2{background:linear-gradient(180deg,#FFF3B0,#FFC93C 45%,#FF8A1C);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #7A3A00)}
.splash p{font-size:19px;line-height:1.55;color:#E3E6FF;max-width:560px}
.splash .tags{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 26px}
.splash .tags span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px}
.splash .hero{position:relative}
.splash .hero .halo{position:absolute;inset:8% 10%;background:radial-gradient(circle,#FFD86B55,transparent 65%);filter:blur(10px)}
.splash .btn{font-size:20px;padding:16px 30px}
/* ---------- forms ---------- */
.form-wrap{max-width:760px;margin:0 auto}
.form-head{display:flex;gap:18px;align-items:center;margin-bottom:12px}
.form-head .sparky{width:110px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field label{display:block;font-weight:900;font-size:14px;margin-bottom:6px;color:var(--ink2);text-transform:uppercase;letter-spacing:.6px}
.field input{width:100%;padding:14px 16px;border-radius:14px;border:3px solid #E7DFCF;background:#fff;font:700 17px var(--body);color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
.field input:focus{border-color:var(--teal);box-shadow:0 0 0 5px #2ED3C333}
.field.err input{border-color:var(--red);animation:shake .4s}
.full{grid-column:1/-1}
.rules{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:18px 0}
.rule{background:#fff;border-radius:18px;padding:16px;display:flex;gap:12px;align-items:flex-start;box-shadow:0 4px 0 #EDE5D4}
.rule .ic{font-size:30px;line-height:1}
.rule b{display:block;font-family:var(--title);font-size:18px;margin-bottom:2px}
/* ---------- map ---------- */
.map-title{color:#fff;text-align:center;margin-bottom:8px}
.map-title h2{font-size:40px;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.map-title p{color:#C9CFFF;font-weight:700;margin:0}
.map{position:relative;margin:18px auto 0;aspect-ratio:16/8.2;max-width:1150px;border-radius:36px;background:radial-gradient(ellipse at 50% 120%,#2FA36B 0%,#1F7A55 35%,transparent 36%),radial-gradient(ellipse at 15% 110%,#2C9A65 0%,transparent 40%),radial-gradient(ellipse at 85% 115%,#2C9A65 0%,transparent 40%),linear-gradient(180deg,#26307A,#3B3F96 60%,#5A4FB0);box-shadow:inset 0 0 0 6px rgba(255,255,255,.08),0 25px 60px rgba(0,0,0,.4);overflow:hidden}
.map svg.road{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:#fff;width:170px}
.node .orb{width:108px;height:108px;border-radius:50%;display:grid;place-items:center;font-size:48px;background:radial-gradient(circle at 35% 30%,#fff8,transparent 40%),linear-gradient(180deg,var(--c1),var(--c2));box-shadow:0 8px 0 rgba(0,0,0,.25),0 0 0 6px rgba(255,255,255,.18),0 18px 30px rgba(0,0,0,.35);transition:transform .2s}
.node:hover .orb{transform:scale(1.08) rotate(-3deg)}
.node.current .orb{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 8px 0 rgba(0,0,0,.25),0 0 0 6px rgba(255,255,255,.25),0 0 0 0 #FFE27A99}50%{box-shadow:0 8px 0 rgba(0,0,0,.25),0 0 0 6px rgba(255,255,255,.25),0 0 0 22px #FFE27A00}}
.node.locked{cursor:not-allowed}
.node.locked .orb{filter:grayscale(1) brightness(.6)}
.node .nm{font-family:var(--title);font-weight:700;font-size:17px;background:rgba(11,16,51,.75);padding:5px 12px;border-radius:12px;text-align:center;line-height:1.15}
.node .nm small{display:block;font-family:var(--body);font-size:11.5px;color:#C9CFFF;font-weight:800}
.stars{font-size:20px;letter-spacing:2px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
.stars .off{opacity:.25}
.map-foot{display:flex;justify-content:center;gap:14px;margin-top:22px;flex-wrap:wrap}
/* ---------- mission intro ---------- */
.intro{display:grid;grid-template-columns:320px 1fr;gap:30px;align-items:center;color:#fff;min-height:65vh}
.intro .big{font-size:84px}
.intro h2{font-size:46px;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.intro .topic{display:inline-block;background:rgba(255,255,255,.12);padding:6px 14px;border-radius:999px;font-weight:900;margin-bottom:14px}
.intro .bubble{margin-bottom:24px;font-size:19px}
.intro .bubble:after{left:-14px;top:40px;bottom:auto;margin:0;border:14px solid transparent;border-right-color:#fff;border-left:0}
/* ---------- task ---------- */
.task{display:grid;grid-template-columns:250px 1fr;gap:24px;align-items:start}
.side{position:sticky;top:80px;display:flex;flex-direction:column;gap:10px}
.side .sparky{width:190px;margin:0 auto}
.side .bubble{font-size:15.5px}
.tcard{padding:26px 28px}
.thead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:12.5px;letter-spacing:.6px;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:#ECE4FF;color:#5B3FA8}
.badge.K{background:#E2F3FF;color:#1D63A8}.badge.A{background:#FFF0D6;color:#A35A00}.badge.C{background:#DDF8EA;color:#1C7A47}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:12px;height:12px;border-radius:50%;background:#E3DACA;display:block}
.dots i.done{background:var(--teal)}.dots i.fail{background:#F3A0A0}.dots i.cur{background:var(--gold2);box-shadow:0 0 0 4px #FFC93C55}
.tcard h2{font-size:30px;line-height:1.1}
.prompt{font-size:18px;line-height:1.55;margin:4px 0 18px;font-weight:600}
.prompt code,.inl{font-family:var(--mono);background:#EFE7FF;padding:1px 6px;border-radius:6px;font-size:.92em;color:#4A2E9A}
.t-area{margin-bottom:16px}
.t-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:2px dashed #E7DFCF;padding-top:16px}
.lives{display:flex;gap:4px;font-size:22px}
.lives .lost{filter:grayscale(1);opacity:.3}
.t-bar .sp{flex:1}
.fb{margin-top:14px;border-radius:18px;padding:14px 16px;font-weight:700;line-height:1.45;display:none}
.fb.show{display:block;animation:pop .35s}
.fb.ok{background:#DDF8EA;color:#13603A;border:2px solid #9BE6BE}
.fb.no{background:#FFE6E6;color:#9A2329;border:2px solid #F5B1B4}
.fb.info{background:#FFF4D6;color:#7A4B00;border:2px solid #FFD98A}
.explain{margin-top:12px;background:#fff;border-radius:18px;padding:16px 18px;border-left:6px solid var(--gold);line-height:1.5;display:none}
.explain.show{display:block;animation:pop .35s}
.explain b.t{font-family:var(--title);font-size:17px;display:block;margin-bottom:4px}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
/* options */
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;background:#fff;border:3px solid #EAE2D2;border-radius:16px;padding:14px 16px;font-size:16.5px;font-weight:700;color:var(--ink);display:flex;gap:12px;align-items:center;transition:transform .1s,border-color .15s,background .15s;box-shadow:0 4px 0 #EDE5D4}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:#C9BEFF}
.opt .k{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#F1ECFF;color:#5B3FA8;font-family:var(--title);font-weight:700}
.opt.sel{border-color:#7B5CFF;background:#F5F1FF}
.opt.sel .k{background:#7B5CFF;color:#fff}
.opt.right{border-color:var(--green);background:#E6FAEF}.opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#FFEDED}
.opt:disabled{cursor:default}
.opt pre{margin:0;flex:1}
/* code */
.code{background:#161A36;color:#E8ECFF;font-family:var(--mono);border-radius:18px;padding:16px 18px;white-space:pre;overflow-x:auto;font-size:15px;line-height:1.7;box-shadow:inset 0 0 0 2px #2A3060;margin:0}
.opt .code{font-size:13.5px;padding:10px 12px;line-height:1.5}
.tk-k{color:#FF8FD1;font-weight:700}.tk-c{color:#FFC861;font-weight:700}.tk-f{color:#6FE3FF}.tk-n{color:#B6FF8A}.tk-cm{color:#7C86B5;font-style:italic}.tk-s{color:#FFB38A}
select.slot{appearance:none;-webkit-appearance:none;font:700 15px var(--mono);background:linear-gradient(180deg,#FFE27A,#FFC21F);color:#3A2400;border:0;border-radius:8px;padding:1px 10px;margin:0 1px;cursor:pointer;box-shadow:0 3px 0 #B87A00;min-width:44px;text-align:center;vertical-align:baseline}
select.slot:focus{outline:3px solid #6FE3FF}
select.slot.good{background:linear-gradient(180deg,#9BF5C2,#38D17F);box-shadow:0 3px 0 #1D8A4E}
select.slot.bad{background:linear-gradient(180deg,#FF9EA1,#FF5A5F);box-shadow:0 3px 0 #A3262B;color:#fff;animation:shake .4s}
select.slot:disabled{cursor:default;opacity:1}
/* order */
.order{display:flex;flex-direction:column;gap:8px;counter-reset:ln}
.oline{display:flex;align-items:center;gap:10px;background:#161A36;border-radius:14px;padding:6px 8px 6px 12px;transition:transform .2s}
.oline:before{counter-increment:ln;content:counter(ln);color:#6B739F;font:700 13px var(--mono);width:18px}
.oline .code{flex:1;padding:4px 6px;box-shadow:none;background:none;font-size:15.5px}
.oline .mv{display:flex;gap:4px}
.oline .mv button{width:38px;height:34px;border-radius:10px;border:0;background:#2A3060;color:#fff;font-size:16px;font-weight:900}
.oline .mv button:hover{background:#3C4590}
.oline.flash{animation:fl .4s}
@keyframes fl{from{background:#3C4590}}
.order.good .oline{box-shadow:0 0 0 3px var(--green)}
/* sort */
.sort{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sitem{background:#fff;border-radius:18px;padding:14px;text-align:center;box-shadow:0 4px 0 #EDE5D4;border:3px solid transparent}
.sitem .em{font-size:38px}
.sitem b{display:block;font-family:var(--title);font-size:19px;margin:2px 0 8px}
.sitem .sw{display:flex;gap:6px}
.sitem .sw button{flex:1;border:2px solid #E3DACA;background:#FBF7EF;border-radius:12px;padding:8px 4px;font-weight:900;font-size:12.5px;color:var(--ink2)}
.sitem .sw button.on.o{background:#FFE9C7;border-color:#FF9F1C;color:#8A4A00}
.sitem .sw button.on.i{background:#D9F1FF;border-color:#4DA6FF;color:#124F86}
.sitem.good{border-color:var(--green)}.sitem.bad{border-color:var(--red)}
/* bug */
.bug{background:#161A36;border-radius:18px;padding:10px;font-family:var(--mono)}
.bline{display:flex;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:3px 8px;color:#E8ECFF;font:500 15px var(--mono);white-space:pre}
.bline .n{color:#5D6595;width:28px;flex:none}
.bline:hover:not(:disabled){background:#262C58}
.bline.sel{background:#3A2C7A;box-shadow:inset 4px 0 0 var(--gold)}
.bline.right{background:#1E5A3D;box-shadow:inset 4px 0 0 var(--green)}
.bline.wrong{background:#5A1E2A}
.bline:disabled{cursor:default}
/* board */
.board{margin-top:16px;background:linear-gradient(180deg,#E9F8F5,#D9EFEA);border-radius:22px;padding:16px;display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center;position:relative;border:3px solid #C3E6DE}
.board.with-serial{grid-template-columns:180px 1fr 220px}
.pcb{position:relative;height:150px;border-radius:16px;background:linear-gradient(135deg,#1B8DA0,#0D6273);box-shadow:inset 0 0 0 3px #0A4E5C,0 6px 0 #0A4E5C;overflow:hidden}
.pcb:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff22 1px,transparent 1.5px);background-size:10px 10px}
.pcb-usb{position:absolute;left:-4px;top:22px;width:34px;height:30px;background:linear-gradient(#D7DDE6,#9AA4B4);border-radius:4px}
.pcb-jack{position:absolute;left:-4px;bottom:20px;width:30px;height:26px;background:#222;border-radius:4px}
.pcb-chip{position:absolute;left:70px;top:70px;width:90px;height:24px;background:#1E1E28;border-radius:3px;box-shadow:0 -4px 0 -2px #bbb,0 4px 0 -2px #bbb}
.pcb-name{position:absolute;right:12px;bottom:12px;color:#fff;font:800 13px var(--title);letter-spacing:2px;opacity:.9}
.pcb-hdr{position:absolute;left:44px;right:10px;top:8px;height:12px;background:repeating-linear-gradient(90deg,#111 0 8px,#333 8px 11px);border-radius:2px}
.pcb-on{position:absolute;left:44px;top:30px;width:8px;height:8px;border-radius:50%;background:#7CFF8A;box-shadow:0 0 10px #7CFF8A}
.comps{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end;justify-content:center}
.comp{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:13px;color:var(--ink2);text-align:center}
.comp small{display:block;font-family:var(--mono);color:#0D6273}
.led{width:44px;height:58px;border-radius:22px 22px 6px 6px;background:color-mix(in srgb,var(--c) 35%,#556);box-shadow:inset 0 -6px 0 rgba(0,0,0,.2);position:relative;transition:background .08s,box-shadow .08s}
.led:after{content:"";position:absolute;left:9px;top:8px;width:10px;height:18px;border-radius:6px;background:#ffffff55}
.led.on{background:var(--c);box-shadow:0 0 18px 6px var(--c),0 0 50px 10px color-mix(in srgb,var(--c) 60%,transparent),inset 0 -6px 0 rgba(0,0,0,.1)}
.legs{width:24px;height:16px;border-left:3px solid #9AA4B4;border-right:3px solid #9AA4B4;margin-top:-6px}
.push{width:74px;height:74px;border-radius:16px;border:0;background:linear-gradient(#4B4F62,#2A2D3A);box-shadow:0 6px 0 #15171F;display:grid;place-items:center;transition:transform .05s,box-shadow .05s;touch-action:none}
.push span{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FF9AA0,#E8343C);box-shadow:0 4px 0 #8E1A20}
.push.down{transform:translateY(5px);box-shadow:0 1px 0 #15171F}
.push.down span{box-shadow:0 1px 0 #8E1A20}
.serial{background:#0E1028;border-radius:14px;color:#9CF7B4;font:600 13px var(--mono);height:150px;display:flex;flex-direction:column;overflow:hidden;box-shadow:inset 0 0 0 2px #2A3060}
.serial-h{background:#2A3060;color:#C9CFFF;padding:5px 10px;font-weight:800;font-size:11.5px;font-family:var(--body);letter-spacing:.5px}
.serial-b{flex:1;padding:6px 10px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;line-height:1.35}
.serial-b .hi{color:#FFE27A}
.board-msg{grid-column:1/-1;display:none;background:#FFE6E6;color:#9A2329;border-radius:12px;padding:10px 12px;font-weight:800}
.board-msg.show{display:block}
.board-ctl{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.board-ctl .tip{font-size:13.5px;color:#2D6F68;font-weight:800}
/* widgets */
.wbox{background:linear-gradient(180deg,#E9F8F5,#D9EFEA);border:3px solid #C3E6DE;border-radius:22px;padding:14px;margin-bottom:16px;display:grid;grid-template-columns:1fr 230px;gap:14px;align-items:center}
.wbox svg{width:100%;height:auto}
.wave{animation:wv 1s linear infinite}
@keyframes wv{0%{opacity:0;transform:scale(.6)}50%{opacity:1}100%{opacity:0;transform:scale(1.3)}}
/* circuit */
.circ{background:linear-gradient(180deg,#FBF6EA,#F3EBDA);border-radius:22px;border:3px solid #E7DCC4;padding:8px;position:relative}
.circ svg{width:100%;height:auto;display:block;user-select:none}
.term{cursor:pointer}
.term circle.hit{fill:transparent}
.term circle.dot{fill:#fff;stroke:#2A2D3A;stroke-width:3;transition:r .15s}
.term:hover circle.dot{r:12;fill:#FFE27A}
.term.sel circle.dot{fill:#FFC93C;r:13;stroke:#C46F00}
.wire{fill:none;stroke-width:7;stroke-linecap:round;cursor:pointer;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.wire:hover{stroke-dasharray:10 6}
.circ-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.circ-live{display:grid;grid-template-columns:1fr 240px;gap:14px;margin-top:12px}
.legend{font-size:14px;font-weight:700;color:var(--ink2);line-height:1.5}
/* mission done */
.done-screen{text-align:center;color:#fff;max-width:760px;margin:0 auto}
.done-screen .sparky{width:230px}
.done-screen h2{font-size:48px;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.done-screen .stars{font-size:64px;margin:6px 0 10px}
.done-screen .stars span{display:inline-block;animation:starpop .5s cubic-bezier(.2,1.6,.4,1) both}
.done-screen .stars span:nth-child(2){animation-delay:.25s}.done-screen .stars span:nth-child(3){animation-delay:.5s}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1)}}
.done-screen p{font-size:19px;color:#E3E6FF;font-weight:700}
/* modal */
#modal{position:fixed;inset:0;z-index:100;background:rgba(8,10,35,.7);backdrop-filter:blur(4px);display:none;place-items:center;padding:20px}
#modal.show{display:grid}
#modal .card{max-width:560px;width:100%;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
#modal .acts{display:flex;gap:12px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:28px;opacity:0;transform:translateX(-50%) translateY(120px);background:#22264A;color:#fff;padding:12px 20px;border-radius:14px;font-weight:800;z-index:120;transition:transform .3s;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
/* ---------- certificate ---------- */
.cert-top{display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:center;color:#fff;max-width:1000px;margin:0 auto 20px}
.cert-top .sparky{width:180px}
.cert-top h2{font-size:40px}
.vote{display:inline-flex;align-items:baseline;gap:6px;background:linear-gradient(180deg,#FFE27A,#FFA41B);color:#5A3300;padding:8px 22px;border-radius:20px;font-family:var(--title);font-weight:700;box-shadow:0 6px 0 #C46F00}
.vote b{font-size:56px;line-height:1}
.vote span{font-size:22px}
.cert-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.sheet{background:#fff;color:#111;max-width:1000px;margin:0 auto;padding:34px 38px;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.45);font-family:"Times New Roman",Georgia,serif}
.sheet h1{font-family:"Times New Roman",Georgia,serif;text-align:center;font-size:20px;letter-spacing:.5px;margin:4px 0 2px}
.sheet .sub{text-align:center;font-size:13px;margin-bottom:12px;font-style:italic}
.gen{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:13px}
.gen td{border:1px solid #000;padding:5px 8px}
.gen td.l{font-weight:700;background:#F2F2F2;width:16%;white-space:nowrap}
table.grid{width:100%;border-collapse:collapse;font-size:12px;line-height:1.28}
table.grid th,table.grid td{border:1px solid #000;padding:4px 6px;vertical-align:middle}
table.grid th{background:#E8E8E8;font-size:11.5px;text-align:center}
table.grid td.crit{font-weight:700;text-align:center;width:13%}
table.grid td.desc{width:22%;font-size:11.5px}
table.grid td.val{width:9%;text-align:center;font-weight:700;font-size:13px}
table.grid tr.picked td.lvl{background:#FFF1B8;font-weight:700}
table.grid tr.picked td.val{background:#FFF1B8}
table.grid tr.picked td.val span{display:inline-block;border:2px solid #000;border-radius:50%;min-width:34px;padding:2px 4px}
table.grid td.lvl .mk{font-weight:900;margin-right:4px}
table.grid tr.tot td{font-weight:700;font-size:13px}
.vbox{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:14px;gap:20px}
.vbox .v{border:2px solid #000;padding:6px 16px;font-size:18px;font-weight:700}
.signs{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:30px;font-size:13px}
.signs div{border-top:1px solid #000;padding-top:4px;text-align:center}
.foot{margin-top:14px;font-size:10.5px;color:#444;text-align:center}
.annex{margin-top:34px;padding-top:20px;border-top:2px dashed #999}
.annex h3{font-family:"Times New Roman",Georgia,serif;font-size:16px;text-align:center}
.annex table{width:100%;border-collapse:collapse;font-size:11px}
.annex th,.annex td{border:1px solid #888;padding:3px 5px}
.annex th{background:#EEE}
.annex .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 16px;font-size:12px;margin:8px 0 12px}
.annex .calc{font-size:11.5px;margin-top:10px;line-height:1.5}
/* responsive */
@media (max-width:900px){
  .splash,.intro,.task,.cert-top{grid-template-columns:1fr}
  .side{position:static;flex-direction:row;align-items:center}
  .side .sparky{width:90px;margin:0}
  .rules,.grid2{grid-template-columns:1fr}
  .board,.board.with-serial,.wbox,.circ-live{grid-template-columns:1fr}
  .sort{grid-template-columns:1fr 1fr}
  .map{aspect-ratio:auto;padding:20px;display:flex;flex-direction:column;gap:16px;align-items:center}
  .map svg.road{display:none}
  .node{position:static;transform:none}
  #hud .logo span.t{display:none}
  .opts.two{grid-template-columns:1fr}
  .sheet{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* print */
@page{size:A4 portrait;margin:9mm 10mm}
@media print{
  body{background:#fff!important}
  #sky,.hills,#hud,.no-print,#toast,#modal,#confetti{display:none!important}
  #app{padding:0;max-width:none}
  .screen{animation:none}
  .sheet{box-shadow:none;border-radius:0;padding:0;max-width:none;margin:0}
  .sheet h1{font-size:15pt;margin:0}
  .sheet .sub{font-size:9.5pt;margin-bottom:6px}
  .gen{font-size:9.5pt;margin-bottom:7px}
  .gen td{padding:3px 6px}
  table.grid{font-size:8.7pt;line-height:1.16}
  table.grid td.desc{font-size:8.2pt}
  table.grid th{font-size:8.2pt}
  table.grid td.val{font-size:9.5pt}
  table.grid th,table.grid td{padding:2px 5px}
  table.grid tr.picked td.val span{padding:0 3px;min-width:28px}
  .vbox{margin-top:7px;font-size:10pt}
  .vbox .v{font-size:13pt;padding:3px 12px}
  .foot{margin-top:6px;font-size:8pt}
  table.grid tr.picked td.lvl,table.grid tr.picked td.val{background:#FFF1B8!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.grid th,.gen td.l{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .annex{break-before:page;page-break-before:always;border-top:0;margin-top:0;padding-top:0}
  .signs{margin-top:26px;font-size:10pt}
}

<body>
<div id="sky"></div>
<svg class="hills" viewBox="0 0 1440 220" preserveAspectRatio="none"><path d="M0 140 Q180 60 360 120 T720 110 T1080 100 T1440 90 V220 H0Z" fill="#14174A" opacity=".8"/><path d="M0 180 Q240 110 480 160 T960 150 T1440 140 V220 H0Z" fill="#0D1036"/></svg>
<header id="hud" class="hidden">
  <div class="logo">⚡ <span class="t"><b>L'Officina Magica</b> di Sparky</span></div>

<script>
"use strict";
/* =========================================================
   L'OFFICINA MAGICA DI SPARKY — prova pratica Arduino
   Contenuti: "Arduino ascolta: digitalRead e if" (Prof. N. Palmeri)
   Valutazione: Griglia di valutazione della prova pratica
   ========================================================= */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const h=html=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>{const r=Math.round(n*100)/100;return String(r).replace('.',',')};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- storage ---------- */
const KEY='sparky_officina_prova_v1', RUNKEY='sparky_officina_runs';
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const fresh=()=>({phase:'splash',student:null,start:null,end:null,tasks:{},hints:0,blur:0,mute:false,run:0,cur:null});
let S=store.get(KEY)||fresh();
const save=()=>store.set(KEY,S);

/* ---------- audio ---------- */
let AC=null;
function tone(f,d,type='sine',v=.07,when=0){if(S.mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}
const sfx={
  ok(){tone(660,.14,'triangle');tone(880,.14,'triangle',.07,.1);tone(1320,.3,'triangle',.06,.2)},
  no(){tone(260,.18,'square',.035);tone(196,.28,'square',.035,.12)},
  click(){tone(1100,.04,'square',.02)},
  wire(){tone(520,.06,'triangle',.05);tone(780,.08,'triangle',.05,.05)},
  fan(){[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.07,i*.13))},
  hint(){tone(988,.1,'sine',.05);tone(1319,.18,'sine',.05,.08)}
};

/* ---------- Sparky ---------- */
const MOUTH={
  happy:'M82 110 Q100 134 118 110 Q100 120 82 110Z',
  big:'M80 106 Q100 142 120 106 Q100 116 80 106Z',
  think:'M88 120 Q99 116 114 118',
  sad:'M86 124 Q100 110 114 124',
  wow:'M93 118 a7 9 0 1 0 14 0 a7 9 0 1 0 -14 0Z'
};
function sparkySVG(mood='happy',cls=''){
  const m=MOUTH[mood]||MOUTH.happy, filled=!['think','sad'].includes(mood);
  const brow=mood==='sad'?'M68 66 Q80 70 92 62|M108 62 Q120 70 132 66':mood==='think'?'M68 62 Q80 54 92 60|M108 64 Q120 64 132 62':'M68 62 Q80 54 92 60|M108 60 Q120 54 132 62';
  const [b1,b2]=brow.split('|');
  return `<svg class="sparky ${mood==='big'?'cheer':''} ${mood==='sad'?'sad':''} ${cls}" viewBox="0 0 200 230" aria-hidden="true">
  <defs>
    <radialGradient id="spHead" cx="40%" cy="32%" r="72%"><stop offset="0" stop-color="#FFF1A8"/><stop offset=".55" stop-color="#FFBE3D"/><stop offset="1" stop-color="#F0861C"/></radialGradient>
    <linearGradient id="spBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5FE3D3"/><stop offset="1" stop-color="#138C9C"/></linearGradient>
    <radialGradient id="spGlow"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#FFF27A"/><stop offset="1" stop-color="#FFB800" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse class="sp-shadow" cx="100" cy="222" rx="46" ry="7" fill="#000" opacity=".28"/>
  <g class="sp-all">
    <path d="M100 38 Q95 22 108 12" stroke="#4E5A80" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle class="sp-spark" cx="108" cy="12" r="18" fill="url(#spGlow)"/>
    <path class="sp-star" d="M108 1 L111 9 L119 12 L111 15 L108 23 L105 15 L97 12 L105 9Z" fill="#fff"/>
    <g class="sp-armL"><path d="M60 150 Q38 156 32 136" stroke="#138C9C" stroke-width="11" stroke-linecap="round" fill="none"/><circle cx="31" cy="131" r="10" fill="#FFBE3D"/></g>
    <g class="sp-armR"><path d="M140 150 Q162 156 168 136" stroke="#138C9C" stroke-width="11" stroke-linecap="round" fill="none"/><circle cx="169" cy="131" r="10" fill="#FFBE3D"/></g>
    <ellipse cx="80" cy="208" rx="17" ry="8" fill="#0E6F7E"/><ellipse cx="120" cy="208" rx="17" ry="8" fill="#0E6F7E"/>
    <rect x="58" y="128" width="84" height="78" rx="32" fill="url(#spBody)"/>
    <rect x="74" y="146" width="52" height="34" rx="10" fill="#0E2F48"/>
    <circle class="sp-led" cx="88" cy="163" r="5.5" fill="#FF5A5F"/><circle cx="100" cy="163" r="5.5" fill="#FFC93C"/><circle cx="112" cy="163" r="5.5" fill="#7CFF8A"/>
    <g class="sp-head">
      <circle cx="44" cy="92" r="10" fill="#4E5A80"/><circle cx="156" cy="92" r="10" fill="#4E5A80"/>
      <circle cx="100" cy="86" r="56" fill="url(#spHead)"/>
      <ellipse cx="78" cy="52" rx="20" ry="9" fill="#fff" opacity=".5" transform="rotate(-25 78 52)"/>
      <g class="sp-eyes">
        <ellipse cx="80" cy="88" rx="15" ry="18" fill="#fff"/><ellipse cx="120" cy="88" rx="15" ry="18" fill="#fff"/>
        <circle cx="83" cy="91" r="9.5" fill="#1D2240"/><circle cx="123" cy="91" r="9.5" fill="#1D2240"/>
        <circle cx="86.5" cy="86" r="3.6" fill="#fff"/><circle cx="126.5" cy="86" r="3.6" fill="#fff"/>
      </g>
      <path d="${b1}" stroke="#8A4A10" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="${b2}" stroke="#8A4A10" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="64" cy="110" rx="9" ry="5.5" fill="#FF6B6B" opacity=".5"/><ellipse cx="136" cy="110" rx="9" ry="5.5" fill="#FF6B6B" opacity=".5"/>
      <path d="${m}" stroke="#7A2E10" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="${filled?'#B8361A':'none'}"/>
    </g>
  </g></svg>`;
}
function say(text,mood='happy'){
  const b=$('#spBubble'),f=$('#spFace');
  if(b){b.innerHTML=text;b.classList.remove('typing');void b.offsetWidth;b.classList.add('typing')}
  if(f)f.innerHTML=sparkySVG(mood);
}

/* ---------- syntax highlight ---------- */
function hl(src){
  const re=/(\/\/[^\n]*)|("[^"]*")|\b(void|int|if|else)\b|\b(HIGH|LOW|OUTPUT|INPUT_PULLUP|INPUT)\b|(Serial\.begin|Serial\.println|\bpinMode|\bdigitalWrite|\bdigitalRead|\bdelay|\bsetup|\bloop)\b|\b(\d+)\b/g;
  let out='',last=0,m;
  while((m=re.exec(src))){out+=esc(src.slice(last,m.index));const cls=m[1]?'cm':m[2]?'s':m[3]?'k':m[4]?'c':m[5]?'f':'n';out+=`<span class="tk-${cls}">${esc(m[0])}</span>`;last=re.lastIndex}
  return out+esc(src.slice(last));
}
const codeBlock=src=>`<pre class="code">${hl(src)}</pre>`;

/* =========================================================
   SIMULATED BOARD
   ========================================================= */
const COLORS={rosso:'#FF4D4D',arancione:'#FF9F1C',verde:'#2EE86B',giallo:'#FFE14D',blu:'#4DA6FF'};
let LIVE=[];   // things to stop when leaving a screen
function cleanup(){LIVE.forEach(f=>{try{f()}catch(e){}});LIVE=[]}
function makeBoard(cfg){
  const el=h(`<div class="board ${cfg.serial?'with-serial':''}">
    <div class="pcb"><div class="pcb-hdr"></div><div class="pcb-usb"></div><div class="pcb-jack"></div><div class="pcb-on"></div><div class="pcb-chip"></div><div class="pcb-name">ARDUINO</div></div>
    <div class="comps"></div>
    ${cfg.serial?'<div class="serial"><div class="serial-h">🖥 MONITOR SERIALE · 9600</div><div class="serial-b"></div></div>':''}
    <div class="board-msg"></div>
    <div class="board-ctl"></div>
  </div>`);
  const comps=$('.comps',el), leds={}, pressed={};
  (cfg.leds||[]).forEach(l=>{const c=h(`<div class="comp"><div class="led" style="--c:${COLORS[l.color]}"></div><div class="legs"></div><div>LED ${l.color}<small>pin ${l.pin}</small></div></div>`);comps.append(c);leds[l.pin]=$('.led',c)});
  (cfg.buttons||[]).forEach(b=>{const c=h(`<div class="comp"><button class="push" aria-label="Pulsante pin ${b.pin}"><span></span></button><div>Pulsante<small>pin ${b.pin}</small></div></div>`);comps.append(c);const p=$('.push',c);pressed[b.pin]=false;
    const dn=e=>{e.preventDefault();pressed[b.pin]=true;p.classList.add('down');sfx.click()},up=()=>{pressed[b.pin]=false;p.classList.remove('down')};
    p.addEventListener('pointerdown',dn);p.addEventListener('pointerup',up);p.addEventListener('pointerleave',up);p.addEventListener('pointercancel',up);
    p.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){if(!pressed[b.pin])dn(e)}});p.addEventListener('keyup',up);
  });
  const serialB=$('.serial-b',el), msg=$('.board-msg',el);
  let tok=null;
  const api={el,ctl:$('.board-ctl',el),
    write(pin,v){if(leds[pin])leds[pin].classList.toggle('on',v==='HIGH')},
    pressed(pin){return !!pressed[pin]},
    print(s,hi){if(!serialB)return;const d=document.createElement('div');d.textContent=s;if(hi)d.className='hi';serialB.append(d);while(serialB.children.length>9)serialB.firstChild.remove()},
    error(t){msg.innerHTML=t;msg.classList.add('show')},
    stop(){if(tok){tok.alive=false;tok.timers.forEach(clearTimeout)}tok=null;Object.values(leds).forEach(l=>l.classList.remove('on'))},
    run(factory){api.stop();msg.classList.remove('show');if(serialB)serialB.innerHTML='';
      const t=tok={alive:true,timers:[]};const loop=factory();
      const io={write:(p,v)=>{if(t.alive)api.write(p,v)},pressed:api.pressed,print:(s,hi)=>{if(t.alive)api.print(s,hi)},
        delay:ms=>new Promise(res=>{const id=setTimeout(()=>{if(t.alive)res()},Math.max(0,ms));t.timers.push(id);if(t.timers.length>200)t.timers.splice(0,100)})};
      (async()=>{while(t.alive){await loop(io);await io.delay(16)}})();
    }};
  LIVE.push(()=>api.stop());
  return api;
}
// adds "Prova" controls to a board, fed by a function returning {factory}|{error}
function boardControls(board,getProgram,tip){
  board.ctl.innerHTML=`<button class="btn small run">▶ Carica sulla scheda</button><button class="btn small light stop">■ Stop</button><span class="tip">${tip||''}</span>`;
  $('.run',board.ctl).onclick=()=>{sfx.click();const p=getProgram();if(p.error){board.stop();board.error('⛔ '+p.error)}else board.run(p.factory)};
  $('.stop',board.ctl).onclick=()=>board.stop();
  return()=>$('.run',board.ctl).click();
}

function interpretLines(lines,map){return()=>async io=>{for(const L of lines){let m=L.match(/digitalWrite\((\w+),\s*(HIGH|LOW)\)/);if(m){io.write(map[m[1]],m[2]);continue}m=L.match(/delay\((\d+)\)/);if(m)await io.delay(+m[1])}}}

function grade(){
  const g={};
  ['K','A','C'].forEach(k=>{const ts=ALL.filter(t=>t.cat===k);const p=ts.reduce((s,t)=>s+peek(t.id).pts,0);const fail=ts.filter(t=>peek(t.id).done&&!peek(t.id).ok).length;const miss=ts.filter(t=>!peek(t.id).done).length;g[k]={n:ts.length,p,r:p/ts.length,fail,miss}});
  const n=ALL.length,done=doneCount(),hints=ALL.filter(t=>peek(t.id).hint).length,c=done/n,hr=hints/n;
  const K=g.K.r, A=g.A.r, C=g.C.r;
  g.K.lvl=K>=.9?0:K>=.75?1:K>=.6?2:K>=.4?3:K>=.15?4:5;
  g.A.lvl=(A>=.9&&g.A.fail===0)?0:A>=.75?1:A>=.55?2:A>=.35?3:A>=.1?4:5;
  g.C.lvl=(C>=.9&&g.C.fail===0)?0:C>=.75?1:C>=.55?2:C>=.35?3:C>=.1?4:5;
  g.D={n,done,hints,c,hr,lvl:(c===1&&hints===0)?0:(c===1&&hr<=.25)?1:(c>=.8&&hr<=.5)?2:c>=.4?3:c>0?4:5};
  const sc=GRID.map(cr=>cr.levels[g[cr.key].lvl][1]);
  g.scores=sc;g.total=sc.reduce((a,b)=>a+b,0);g.vote=g.total<2?2:g.total;
  return g;
}

function confetti(n=160){const cv=$('#confetti'),cx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#FFC93C','#FF6FA8','#2ED3C3','#7B5CFF','#33D17A','#FF9F1C'];
  const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*16-4,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  let f=0;(function fr(){cx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);cx.restore()});if(++f<170)requestAnimationFrame(fr);else cx.clearRect(0,0,cv.width,cv.height)})();}

R.slots=(t,area)=>{

  parts.forEach(p=>{const m=p.match(/^\[\[(\d+)\]\]$/);if(m){const i=+m[1],s=t.slots[i];html+=`<select class="slot" data-i="${i}" aria-label="spazio ${i+1}"><option value="">?</option>${s.opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`}else html+=hl(p)});
  const pre=h(`<pre class="code">${html}</pre>`);area.append(pre);
  const sels=$$('select.slot',pre);sels.forEach(s=>s.onchange=()=>{s.classList.remove('bad','good');sfx.click()});
  const ans=()=>{const a=[];sels.forEach(s=>a[+s.dataset.i]=s.value);return a};
  let board=null,runNow=null;
  if(t.board){board=makeBoard(t.board);area.append(board.el);
    runNow=boardControls(board,()=>{const a=ans();const err=t.compile&&t.compile(a);return err?{error:err}:{factory:t.sim(a)}},t.tip||'Carica il codice e osserva la scheda.')}
  return{check(){const a=ans();if(a.some(v=>!v)){sels.filter(s=>!s.value).forEach(s=>{s.classList.add('bad');setTimeout(()=>s.classList.remove('bad'),700)});return{none:true,msg:'Completa tutti gli spazi gialli!'}}
      const wrong=sels.filter(s=>s.value!==t.slots[+s.dataset.i].ans);sels.forEach(s=>s.classList.toggle('bad',wrong.includes(s)));
      if(!wrong.length)return{ok:true};const w=wrong[0],s=t.slots[+w.dataset.i];
      return{ok:false,msg:`${wrong.length===1?'C\'è 1 spazio sbagliato':'Ci sono '+wrong.length+' spazi sbagliati'} (in rosso). ${(s.why&&s.why[w.value])||''}`}},
    reveal(){sels.forEach(s=>{s.value=t.slots[+s.dataset.i].ans})},
    lock(){sels.forEach(s=>{s.disabled=true;s.classList.remove('bad');s.classList.add('good')})},
    onSolved(){if(runNow)runNow()}};
};

      <line x1="392" y1="92" x2="548" y2="92" stroke="#FFC21F" stroke-width="4" stroke-dasharray="8 6" opacity=".9"/>
      <line x1="392" y1="192" x2="548" y2="192" stroke="#FFC21F" stroke-width="4" stroke-dasharray="8 6" opacity=".9"/>
      <line class="cab" x1="470" y1="92" x2="470" y2="192" stroke="#7CFF8A" stroke-width="7" opacity="0"/>
      <circle class="cap" cx="470" cy="142" r="36" fill="#E8343C" stroke="#8E1A20" stroke-width="5"/>
      <text x="470" y="245" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="14" fill="#5A5F86">pulsante (A–A e B–B collegati dentro)</text>
      <line x1="420" y1="330" x2="600" y2="330" stroke="#9AA4B4" stroke-width="5"/>
      <rect x="470" y="314" width="80" height="32" rx="10" fill="#E9D3A8" stroke="#8A6A3A" stroke-width="2"/>
      <rect x="484" y="314" width="7" height="32" fill="#8B4513"/><rect x="498" y="314" width="7" height="32" fill="#111"/><rect x="512" y="314" width="7" height="32" fill="#FF8C00"/><rect x="535" y="314" width="5" height="32" fill="#C9A227"/>
      <text x="510" y="300" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="15" fill="#5A3B10">10 kΩ</text>
    </g>
    <g class="wires"></g><g class="terms"></g>
  </svg></div>`);
  area.append(wrap);
  const svg=$('svg',wrap),gw=$('.wires',svg),gt=$('.terms',svg),cap=$('.cap',svg),cab=$('.cab',svg);
  const NS='http://www.w3.org/2000/svg';
  Object.entries(T).forEach(([k,[x,y,l]])=>{const g=document.createElementNS(NS,'g');g.setAttribute('class','term');g.dataset.k=k;
    g.innerHTML=`<circle class="hit" cx="${x}" cy="${y}" r="20"/><circle class="dot" cx="${x}" cy="${y}" r="10"/>${l&&k[0]!=='V'&&k!=='D2'&&k!=='D3'&&k!=='GND'?`<text x="${x}" y="${y-17}" text-anchor="middle" font-family="Fredoka" font-weight="700" font-size="18" fill="#22264A">${l}</text>`:''}`;
    g.addEventListener('click',()=>{if(locked)return;if(sel===null){sel=k}else if(sel===k){sel=null}else{const a=sel,b=k;if(!wires.some(w=>(w[0]===a&&w[1]===b)||(w[0]===b&&w[1]===a))){wires.push([a,b]);sfx.wire()}sel=null}drawW()});
    gt.append(g)});
  const colOf=w=>w.includes('V5')?'#E8343C':w.includes('GND')?'#2A2D3A':['#FFB800','#2F80ED','#27AE60','#9B51E0'][wires.indexOf(w)%4];
  function drawW(){gw.innerHTML='';wires.forEach(w=>{const [x1,y1]=T[w[0]],[x2,y2]=T[w[1]];const mx=(x1+x2)/2;let dy=0;if(Math.abs(x2-x1)<40)dy=60;else if(Math.abs(y2-y1)<40)dy=(Math.min(y1,y2)>260?-44:-58);
      const p=document.createElementNS(NS,'path');p.setAttribute('d',`M${x1} ${y1} C ${mx} ${y1-dy}, ${mx} ${y2-dy}, ${x2} ${y2}`);p.setAttribute('class','wire');p.setAttribute('stroke',colOf(w));
      p.addEventListener('click',()=>{if(locked)return;wires=wires.filter(x=>x!==w);sfx.click();drawW()});gw.append(p)});
    $$('.term',gt).forEach(g=>g.classList.toggle('sel',g.dataset.k===sel));$('.wcount',area)&&($('.wcount',area).textContent=wires.length)}
  function nets(pr,internal=true){const p={};const f=x=>{while(p[x]&&p[x]!==x)x=p[x];return x};const u=(a,b)=>{a=f(a);b=f(b);if(a!==b)p[a]=b};
    Object.keys(T).forEach(k=>p[k]=k);wires.forEach(([a,b])=>u(a,b));if(internal){u('A1','A2');u('B1','B2');if(pr)u('A1','B1')}return f}
  function level(pr){const f=nets(pr);if(f('V5')===f('GND'))return'SHORT';const d=f('D2');if(d===f('V5'))return'HIGH';if(d===f('GND'))return'LOW';
    const o=d===f('R1')?f('R2'):d===f('R2')?f('R1'):null;if(o!==null){if(o===f('GND'))return'LOW';if(o===f('V5'))return'HIGH'}return'FLOAT'}
  const bar=h(`<div class="circ-bar"><button class="btn small light" id="clr">🧹 Togli tutti i fili</button><button class="btn small" id="live">🔬 Prova dal vivo</button><span class="legend">Fili: <b class="wcount">0</b> · clicca un pallino, poi un altro. Clicca un filo per toglierlo.</span></div>`);
  area.append(bar);
  const liveBox=h(`<div class="circ-live hidden"><div class="legend">👆 Tieni premuto il <b>bottone rosso</b> nel disegno e guarda cosa legge <b>digitalRead(2)</b> sul monitor seriale.</div><div class="serial"><div class="serial-h">🖥 digitalRead(2)</div><div class="serial-b"></div></div></div>`);area.append(liveBox);
  const sb=$('.serial-b',liveBox);let iv=null;
  const setP=p=>{pressed=p;cab.setAttribute('opacity',p?1:0);cap.setAttribute('r',p?31:36)};
  cap.style.cursor='pointer';cap.addEventListener('pointerdown',()=>{setP(true);sfx.click()});['pointerup','pointerleave'].forEach(e=>cap.addEventListener(e,()=>setP(false)));
  function startLive(){liveBox.classList.remove('hidden');if(iv)return;iv=setInterval(()=>{const l=level(pressed);let v;if(l==='SHORT')v='⚠ CORTOCIRCUITO!';else if(l==='FLOAT')v=Math.random()<.5?'1':'0';else v=l==='HIGH'?'1':'0';
    const d=document.createElement('div');d.textContent=v;if(v!=='0')d.className='hi';sb.append(d);while(sb.children.length>9)sb.firstChild.remove()},250)}
  LIVE.push(()=>clearInterval(iv));
  $('#clr',bar).onclick=()=>{if(locked)return;wires=[];sel=null;drawW()};
  $('#live',bar).onclick=startLive;
  drawW();
  return{check(){
      if(!wires.length)return{none:true,msg:'Collega almeno un filo!'};
      const rel=level(false),pr=level(true);
      if(rel==='SHORT'||pr==='SHORT')return{ok:false,msg:'⚠ Cortocircuito! 5V e GND risultano collegati direttamente'+(pr==='SHORT'&&rel!=='SHORT'?' quando premi il pulsante':'')+'. Ricontrolla i fili.'};
      if(rel==='LOW'&&pr==='HIGH')return{ok:true};
      const f=nets(false),fn=nets(false,false);
      const usesD3=wires.some(w=>w.includes('D3'))&&!wires.some(w=>w.includes('D2'));
      if(usesD3)return{ok:false,msg:'Il programma legge il pin 2: collega il circuito a D2, non a D3!'};
      if(rel==='HIGH'&&pr==='HIGH'){if(f('V5')===f('D2')&&fn('V5')!==fn('D2'))return{ok:false,msg:'Pulsante ruotato! Hai usato due piedini della stessa coppia: D2 è sempre collegato a 5V e sembra sempre premuto.'};return{ok:false,msg:'D2 legge sempre HIGH: è collegato a 5V anche senza premere.'}}
      if(rel==='FLOAT')return{ok:false,msg:'Pin flottante! Senza pressione D2 non è collegato a niente e legge valori a caso: manca la resistenza da 10 kΩ tra D2 e GND.'};
      if(rel==='HIGH'&&pr==='LOW')return{ok:false,msg:'Hai costruito un pull-up (logica invertita). La missione chiede il pull-down: pulsante verso 5V e resistenza da 10 kΩ tra D2 e GND.'};
      if(rel==='LOW'&&pr!=='HIGH')return{ok:false,msg:'Senza pressione legge LOW, bene! Ma premendo D2 non riceve i 5V: collega l\'altra coppia del pulsante a 5V (coppie diverse!).'};
      return{ok:false,msg:'Il circuito non funziona ancora come richiesto. Prova dal vivo per capire cosa legge D2.'}},
    reveal(){wires=SOL.map(w=>w.slice());sel=null;drawW()},lock(){locked=true;sel=null;drawW()},onSolved(){startLive()}};
};

/* ---------- task screen ---------- */
function showTask(mi,ti){
  const m=MISSIONS[mi],t=m.tasks[ti],r=rec(t.id);S.cur={mi,ti};save();hud();
  const say0=t.say||'';
  const el=screen(`<div class="task">
    <aside class="side"><div id="spFace">${sparkySVG('happy')}</div><div class="bubble" id="spBubble">${say0}</div></aside>
    <div class="card tcard" id="tc">
      <div class="thead"><span class="badge">${m.icon} Missione ${mi+1} · Sfida ${ti+1}/${m.tasks.length}</span><span class="badge ${t.cat}">${CAT[t.cat]}</span>
        <div class="dots">${m.tasks.map((x,j)=>{const p=peek(x.id);return`<i class="${j===ti?'cur':p.done?(p.ok?'done':'fail'):''}"></i>`}).join('')}</div></div>
      <h2>${t.title}</h2>
      <div class="prompt">${t.prompt}</div>
      <div class="t-area"></div>
      <div class="t-bar"><div class="lives" title="Tentativi rimasti"></div><span class="sp"></span>
        <button class="btn light small" id="bHint">💡 Aiuto di Sparky</button>
        <button class="btn gold" id="bCheck">✔ Verifica</button>
        <button class="btn hidden" id="bNext">Avanti →</button></div>
      <div class="fb"></div>
      <div class="explain"></div>
    </div></div>`);
  const ctl=R[t.type](t,$('.t-area',el));
  const lives=$('.lives',el),fb=$('.fb',el),ex=$('.explain',el),bc=$('#bCheck',el),bn=$('#bNext',el),bh=$('#bHint',el),card=$('#tc',el);
  const drawLives=()=>{lives.innerHTML=Array.from({length:MAXATT},(_,i)=>`<span class="${i<r.att?'lost':''}">❤️</span>`).join('')};drawLives();
  const showFb=(cls,html)=>{fb.className='fb show '+cls;fb.innerHTML=html};
  if(r.hint){showFb('info','💡 <b>Indizio:</b> '+t.hint);bh.disabled=true}
  bh.onclick=()=>{if(r.done)return;if(!r.hint){r.hint=true;S.hints++;save()}sfx.hint();say('💡 '+t.hint,'think');showFb('info','💡 <b>Indizio:</b> '+t.hint);bh.disabled=true};
  const finish=()=>{bc.classList.add('hidden');bh.classList.add('hidden');bn.classList.remove('hidden');ex.innerHTML=`<b class="t">📘 Lo sapevi?</b>${t.explain}`;ex.classList.add('show');hud();bn.focus()};
  bc.onclick=()=>{
    if(r.done)return;const res=ctl.check();
    if(res.none){sfx.no();toast(res.msg||'Rispondi prima di verificare!');return}
    r.att++;
    if(res.ok){r.done=true;r.ok=true;r.pts=PTS[r.att-1];save();ctl.lock();ctl.onSolved&&ctl.onSolved();sfx.ok();
      const praise=r.att===1?['Perfetto al primo colpo! 🌟','Fantastico, sei un vero inventore! ✨','Scintille perfette! ⚡'][Math.random()*3|0]:['Ce l\'hai fatta! 💪','Ottimo, hai corretto il tiro! 👍'][Math.random()*2|0];
      say(praise,'big');showFb('ok',`✅ <b>${praise}</b> +${Math.round(r.pts*100)} scintille`);if(r.att===1)confetti(70);finish()}
    else{sfx.no();card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
      if(r.att>=MAXATT){r.done=true;r.ok=false;r.pts=0;save();ctl.reveal();ctl.lock();ctl.onSolved&&ctl.onSolved();say('Non preoccuparti: anche i grandi inventori sbagliano! Guarda la soluzione corretta. 🤗','sad');
        showFb('no',`❌ ${res.msg}<br><b>Tentativi finiti:</b> ecco la soluzione corretta.`);finish()}
      else{save();const left=MAXATT-r.att;say(['Quasi! Ragiona ancora un attimo. 🤔','Non arrenderti, ci sei vicino!','Hmm... rileggi con calma la richiesta.'][Math.random()*3|0],'think');
        showFb('no',`❌ ${res.msg} <br><small>Ti ${left===1?'resta 1 tentativo':'restano '+left+' tentativi'}.</small>`)}}
    drawLives();hud()};
  bn.onclick=()=>{sfx.click();if(ti+1<m.tasks.length)showTask(mi,ti+1);else missionComplete(mi)};
}
function missionComplete(mi){
  const m=MISSIONS[mi],st=missionStars(mi);
  const ok=m.tasks.filter(t=>peek(t.id).ok).length;
  const last=mi===MISSIONS.length-1;
  const el=screen(`<div class="done-screen">${sparkySVG('big')}<h2>${m.icon} ${m.title}: completata!</h2>
    <div class="stars">${[0,1,2].map(i=>`<span class="${i<st?'':'off'}">⭐</span>`).join('')}</div>
    <p>Hai superato ${ok} sfide su ${m.tasks.length}. ${last?'Borgo Scintilla è di nuovo illuminato! 🎆 Ora puoi consegnare la prova.':'Un\'altra parte del borgo si è illuminata! Nuova missione sbloccata. 🔓'}</p>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap">${last?'<button class="btn pink" id="fin">📨 Consegna la prova</button>':''}<button class="btn gold" id="map">🗺️ Torna alla mappa</button></div></div>`);
  sfx.fan();confetti(200);
  $('#map',el).onclick=showMap;if(last)$('#fin',el).onclick=()=>$('#hDeliver').click();
}
function deliver(){S.end=Date.now();S.phase='cert';save();sfx.fan();confetti(220);showCert()}

/* ---------- certificate ---------- */
function code(){const s=(S.student?S.student.nome:'')+S.start;let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))>>>0;return x.toString(36).toUpperCase().slice(0,6).padStart(6,'0')}
function showCert(){
  hud();
  const g=grade(),st=S.student||{},dt=st.data?st.data.split('-').reverse().join('/'):'';
  const dur=S.end&&S.start?Math.round((S.end-S.start)/60000):0;
  const fdt=ts=>ts?new Date(ts).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
  const rows=GRID.map((cr,ci)=>cr.levels.map(([txt,val],li)=>{const pk=g[cr.key].lvl===li;
    return`<tr class="${pk?'picked':''}">${li===0?`<td class="crit" rowspan="6">${cr.name}</td><td class="desc" rowspan="6">${cr.desc}</td>`:''}<td class="lvl">${pk?'<span class="mk">✔</span>':''}${txt}</td><td class="val"><span>${fmt(val)}</span></td></tr>`}).join('')).join('');
  const mood=g.vote>=8?'big':g.vote>=6?'happy':'think';
  const msg=g.vote>=9?'Sei un vero Maestro Inventore! 🏆':g.vote>=7?'Ottimo lavoro, apprendista! ✨':g.vote>=6?'Ce l\'hai fatta! Continua così. 💪':'Non mollare: ogni inventore impara dagli errori! 🤗';
  const outcome=t=>{const p=peek(t.id);if(!p.done)return'— non svolta';if(!p.ok)return'✗ non risolta (3 errori)';return'✓ al '+p.att+'° tentativo'};
  const annexRows=MISSIONS.map((m,mi)=>m.tasks.map((t,ti)=>{const p=peek(t.id);return`<tr><td>${mi+1}.${ti+1}</td><td>${esc(m.title)} – ${esc(t.title)}</td><td>${CAT[t.cat]}</td><td>${outcome(t)}</td><td style="text-align:center">${p.hint?'sì':'no'}</td><td style="text-align:center">${fmt(p.pts)}</td></tr>`}).join('')).join('');
  const pct=x=>Math.round(x*100)+'%';
  const el=screen(`
   <div class="cert-top no-print"><div>${sparkySVG(mood)}</div><div>
     <h2>Prova consegnata, ${esc((st.nome||'').split(' ').slice(-1)[0]||'apprendista')}!</h2>
     <p style="font-size:18px;font-weight:700;color:#E3E6FF;margin:0 0 12px">${msg}</p>
     <div class="vote"><span>Voto</span><b>${fmt(g.vote)}</b><span>/10</span></div>
     <div class="cert-actions"><button class="btn gold" id="pr">🖨️ Stampa / Salva PDF (A4)</button><button class="btn ghost" id="nw">↺ Nuova prova</button></div>
   </div></div>
   <div class="sheet">
     <h1>GRIGLIA DI VALUTAZIONE DELLA PROVA PRATICA</h1>
     <div class="sub">Prova pratica: Arduino – Input digitale e if · “L'Officina Magica di Sparky”</div>
     <table class="gen">
       <tr><td class="l">Alunno/a</td><td colspan="3"><b>${esc(st.nome||'')}</b></td></tr>
       <tr><td class="l">Classe e sezione</td><td>${esc(st.classe||'')}</td><td class="l">Data</td><td>${esc(dt)}</td></tr>
       <tr><td class="l">Istituto</td><td>${esc(st.istituto||'')}</td><td class="l">Disciplina</td><td>${esc(st.disciplina||'')}</td></tr>
     </table>
     <table class="grid">
       <thead><tr><th>CRITERI PER LA VALUTAZIONE</th><th>DESCRITTORI</th><th>PUNTEGGIO DA ASSEGNARE</th><th>PUNTEGGIO ASSEGNATO</th></tr></thead>
       <tbody>${rows}
       <tr class="tot"><td colspan="2" style="font-weight:400;font-style:italic">Se il totale è minore di 2, verrà assegnato voto 2/10</td><td style="text-align:right">TOTALE</td><td class="val">${fmt(g.total)}</td></tr></tbody>
     </table>
     <div class="vbox"><div>Punteggi assegnati: ${GRID.map((c,i)=>`${c.name.split(' ')[0][0]+c.name.split(' ')[0].slice(1).toLowerCase()} ${fmt(g.scores[i])}`).join(' + ')} = <b>${fmt(g.total)}</b>${g.total<2?' → soglia minima applicata':''}</div><div class="v">VOTO: ${fmt(g.vote)}/10</div></div>
     <div class="signs"><div>Firma dell'alunno/a</div><div>Firma del docente</div></div>
     <div class="foot">Griglia compilata automaticamente al termine della prova · consegna ${fdt(S.end)} · codice prova ${code()}</div>
     <div class="annex">
       <h3>Allegato – Registro automatico della prova</h3>
       <div class="meta"><div><b>Inizio:</b> ${fdt(S.start)}</div><div><b>Consegna:</b> ${fdt(S.end)}</div><div><b>Durata:</b> ${dur} min</div>
         <div><b>Sfide affrontate:</b> ${g.D.done}/${g.D.n}</div><div><b>Aiuti richiesti:</b> ${g.D.hints}</div><div><b>Uscite dalla finestra:</b> ${S.blur}</div>
         <div><b>Prove avviate su questo PC:</b> ${S.run}</div><div><b>Codice prova:</b> ${code()}</div></div>
       <table><thead><tr><th>N.</th><th>Sfida</th><th>Criterio</th><th>Esito</th><th>Aiuto</th><th>Punti</th></tr></thead><tbody>${annexRows}</tbody></table>
       <div class="calc"><b>Come è stato attribuito il punteggio.</b> Ogni sfida vale 1 punto se risolta al 1° tentativo, 0,6 al 2°, 0,3 al 3°, 0 se non risolta o non svolta.<br>
       • Conoscenze: ${fmt(g.K.p)}/${g.K.n} (${pct(g.K.r)}) → fascia ${fmt(g.scores[0])} [≥90% → 3; ≥75% → 2,5; ≥60% → 2; ≥40% → 1,5; ≥15% → 0,75; altrimenti 0]<br>
       • Abilità e competenze: ${fmt(g.A.p)}/${g.A.n} (${pct(g.A.r)}), sfide non risolte ${g.A.fail} → fascia ${fmt(g.scores[1])} [≥90% senza sfide non risolte → 2,5; ≥75% → 2,25; ≥55% → 1,5; ≥35% → 1; ≥10% → 0,5; altrimenti 0]<br>
       • Correttezza della soluzione: ${fmt(g.C.p)}/${g.C.n} (${pct(g.C.r)}), sfide non risolte ${g.C.fail} → fascia ${fmt(g.scores[2])} [≥90% senza sfide non risolte → 2,5; ≥75% → 2; ≥55% → 1,5; ≥35% → 1; ≥10% → 0,5; altrimenti 0]<br>
       • Completezza e autonomia: svolte ${g.D.done}/${g.D.n}, aiuti ${g.D.hints} → fascia ${fmt(g.scores[3])} [tutte senza aiuti → 2; tutte con aiuti ≤25% → 1,5; ≥80% con aiuti ≤50% → 1,25; ≥40% → 0,5; meno → 0,25; nessuna → 0]</div>
     </div>
   </div>`);
  $('#pr',el).onclick=()=>window.print();
  $('#nw',el).onclick=()=>modal('<h2>↺ Nuova prova?</h2><p style="font-size:17px;line-height:1.5">Il certificato attuale verrà <b>cancellato</b> da questo computer. Stampalo o salvalo in PDF prima di continuare.<br><br>Il numero di prove avviate su questo PC resterà registrato sul prossimo certificato.</p>',
    [['Annulla','light',null],['Cancella e ricomincia','pink',()=>{const mute=S.mute;S=fresh();S.mute=mute;save();showSplash()}]]);
}

/* ---------- boot ---------- */
function boot(){
  hud();
  if(S.phase==='cert'){showCert();return}
  if(S.phase==='game'&&S.student){
    if(S.cur){const {mi,ti}=S.cur;const t=MISSIONS[mi]&&MISSIONS[mi].tasks[ti];if(t&&!peek(t.id).done){showTask(mi,ti);toast('Prova ripresa da dove eri rimasto');return}}
    showMap();toast('Prova ripresa da dove eri rimasto');return}
  showSplash();
}
boot();
</script>
</body>
